name: Lightweight checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python reproduce.py --help
      - run: python reproduce.py --config configs/smoke.json --annotations examples/synthetic/custom.json --video-root examples/synthetic --validate-only
      - run: python -m compileall -q .
